
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Catálogo — SHIORI Notes</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="index.html" class="logo">SHIORI. 栞</a>

            <div class="header-actions">
                <nav>
                    <ul>
                        <li><a href="index.html">Início</a></li>
                        <li><a href="catalogo.html">Catálogo</a></li>
                        <li><a href="estatisticas.html">Estatísticas</a></li>
                    </ul>
                </nav>

                <button id="language-toggle" aria-label="Change language">
                    EN
                </button>

                <button id="theme-toggle">
                    <span class="theme-icon">☾</span>
                    <span class="theme-text">Alternar Tema</span>
                </button>
            </div>
        </header>

        <main>
            <section class="catalogo">

                <div class="catalogo-header">
                    <h1 data-i18n="tituloCatalogo">Meu Catálogo</h1>
                    <p data-i18n="descricaoCatalogo">
                        Suas histórias favoritas, reunidas em um só lugar.
                    </p>
                </div>

                <div class="catalogo-stats">

                    <div class="stat-card">
                        <h3 data-i18n="totalTitulos">Total de títulos</h3>
                        <p id="total-titulos">0</p>
                    </div>

                    <div class="stat-card">
                        <h3 data-i18n="concluidos">Concluídos</h3>
                        <p id="total-concluidos">0</p>
                    </div>

                    <div class="stat-card">
                        <h3 data-i18n="emAndamento">Em andamento</h3>
                        <p id="total-andamento">0</p>
                    </div>

                </div>

                <div class="catalogo-acoes">
                    <button id="abrir-formulario" type="button" data-i18n="adicionarTitulo">
                        + Adicionar título
                    </button>
                </div>

                <div class="formulario-container" id="formulario-container">

                    <h2 id="titulo-formulario" data-i18n="adicionarTituloFormulario">
                        Adicionar título
                    </h2>

                    <form id="formulario-titulo">

                        <div class="campo-formulario">
                            <label for="nome-titulo" data-i18n="nomeTitulo">Nome do título</label>
                            <input
                                type="text"
                                id="nome-titulo"
                                placeholder="Ex: Fullmetal Alchemist: Brotherhood"
                                data-i18n-placeholder="exemploTitulo"
                                required
                            >
                        </div>

                        <div class="campo-formulario">
                            <label for="tipo-titulo" data-i18n="tipo">Tipo</label>
                            <select id="tipo-titulo" required>
                                <option value="" data-i18n="selecione">Selecione</option>
                                <option value="anime" data-i18n="anime">Anime</option>
                                <option value="manga" data-i18n="manga">Mangá</option>
                            </select>
                        </div>

                        <div class="campo-formulario">
                            <label for="status-titulo" data-i18n="status">Status</label>
                            <select id="status-titulo" required>
                                <option value="" data-i18n="selecione">Selecione</option>
                                <option value="assistindo" data-i18n="assistindo">Assistindo</option>
                                <option value="lendo" data-i18n="lendo">Lendo</option>
                                <option value="concluido" data-i18n="concluido">Concluído</option>
                                <option value="pausado" data-i18n="pausado">Pausado</option>
                            </select>
                        </div>

                        <div class="campo-formulario">
                            <label for="progresso-titulo" data-i18n="progresso">Progresso</label>
                            <input
                                type="number"
                                id="progresso-titulo"
                                min="0"
                                placeholder="Quantidade de episódios ou volumes"
                                data-i18n-placeholder="placeholderProgresso"
                            >
                        </div>

                        <div class="campo-formulario">
                            <label for="imagem-titulo" data-i18n="capa">Capa</label>
                            <input
                                type="file"
                                id="imagem-titulo"
                                accept="image/*"
                            >
                        </div>

                        <div class="botoes-formulario">

                            <button type="submit" data-i18n="adicionarAoCatalogo">
                                Adicionar ao catálogo
                            </button>

                            <button type="button" id="cancelar-edicao" data-i18n="cancelar">
                                Cancelar
                            </button>

                        </div>

                    </form>
                </div>

                <div class="catalogo-controles">

                    <div class="campo-busca">
                        <input
                            type="search"
                            id="busca-titulo"
                            placeholder="Buscar título..."
                            data-i18n-placeholder="buscarTitulo"
                        >
                    </div>

                    <div class="campo-ordenacao">
                        <select id="ordenar-titulos" aria-label="Ordenar títulos">
                            <option value="recentes" data-i18n="ordenacaoRecentes">Adicionados recentemente</option>
                            <option value="antigos" data-i18n="ordenacaoAntigos">Mais antigos primeiro</option>
                            <option value="az" data-i18n="ordenacaoAZ">Nome (A–Z)</option>
                            <option value="za" data-i18n="ordenacaoZA">Nome (Z–A)</option>
                        </select>
                    </div>

                    <div class="filtros">

                        <select id="filtro-tipo">
                            <option value="todos" data-i18n="todos">Todos</option>
                            <option value="anime" data-i18n="anime">Anime</option>
                            <option value="manga" data-i18n="manga">Mangá</option>
                        </select>

                        <select id="filtro-status">
                            <option value="todos" data-i18n="todosStatus">Todos os status</option>
                            <option value="assistindo" data-i18n="assistindo">Assistindo</option>
                            <option value="lendo" data-i18n="lendo">Lendo</option>
                            <option value="concluido" data-i18n="concluido">Concluído</option>
                            <option value="pausado" data-i18n="pausado">Pausado</option>
                        </select>

                    </div>

                    <button type="button" id="limpar-filtros" hidden data-i18n="limparFiltros">
                        Limpar filtros
                    </button>

                </div>

                <div class="catalogo-lista">
                </div>

            </section>
        </main>

        <footer>
            <div class="footer-top">
                <div class="footer-brand">
                    <h2>SHIORI. 栞</h2>
                    <p data-i18n="fraseRodape">
                        Histórias que merecem ser guardadas.
                    </p>
                </div>
            </div>

            <div class="footer-bottom">
                <p>© 2026 SHIORI Notes.</p>
                <span data-i18n="feitoComAmor">
                    Feito com amor.
                </span>
            </div>
        </footer>

        <script src="main.js"></script>

    </body>
</html>
